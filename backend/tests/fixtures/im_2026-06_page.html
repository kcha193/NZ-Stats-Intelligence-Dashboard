ot;ShowBlockTitle&quot;:0,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;xAxisTitle&quot;:null,&quot;yAxisTitle&quot;:&quot;Number&quot;,&quot;yAxisDualRightTitle&quot;:null,&quot;GraphMetadata&quot;:&quot;&lt;p&gt;&lt;span class=\&quot;u-font-size-small\&quot;&gt;Stats NZ estimates from the March 2025 month, and Australian Bureau of Statistics (ABS) estimates from the March 2025 quarter, are provisional and subject to revision.&lt;\/span&gt;&lt;\/p&gt;\n&lt;p&gt;&lt;span class=\&quot;u-font-size-small\&quot;&gt;The country of last\u202fprevious\u202fresidence (CLPR) of migrants arriving in New Zealand and Australia is not always known.\u202f\u202f\u202f&lt;\/span&gt;&lt;\/p&gt;\n&lt;p&gt;&lt;span class=\&quot;u-font-size-small\&quot;&gt;To estimate net migration using the two series \u2018Estimated migrant arrivals to Australia ... (quarterly)\u2019 and \u2018Estimated migrant arrivals by citizenship, visa type and CLPR, 12\/16-month rule (quarterly)...\u2019, an allowance for non-response to the CLPR question on both New Zealand and Australian arrival cards has been made.\u202f\u202f\u202f&lt;\/span&gt;&lt;\/p&gt;\n&lt;p&gt;&lt;span class=\&quot;u-font-size-small\&quot;&gt;For \u2018Estimated migrant arrivals by citizenship, visa type and CLPR...\u2019 non-response to CLPR is prorated based on the distribution of those with a CLPR by citizenship (\u2018NZ\u2019,\u202f\u2018non-NZ\u2019). These estimates will differ from the\u202fInfoshare\u202fseries, which makes no adjustment for CLPR non-response.\u202f\u202f&lt;\/span&gt;&lt;\/p&gt;\n&lt;p&gt;&lt;span class=\&quot;u-font-size-small\&quot;&gt;For \u2018Estimated migrant arrivals to Australia...\u2019 the proration is based on a combination of birthplace (\u2018NZ\u2019,\u202f\u2018non-NZ\u2019) and citizenship (\u2018NZ\u2019,\u202f\u2018non-NZ\u2019).\u202f\u202f\u202f&lt;\/span&gt;&lt;\/p&gt;\n&lt;p&gt;&lt;span class=\&quot;u-font-size-small\&quot;&gt;&lt;span class=\&quot;u-font-size-small\&quot;&gt;The implied migrant flows with the rest of the world, excluding Australia, can be derived by subtracting the trans-Tasman flows from New Zealand\u2019s total migrant flows.&lt;\/span&gt;&lt;\/span&gt;&lt;\/p&gt;&quot;,&quot;SeriesData&quot;:[{&quot;ID&quot;:35681,&quot;Title&quot;:&quot;Estimated migration between New Zealand and Australia, and the rest of the world, quarterly, December 2003\u2013December 2025&quot;,&quot;ClassName&quot;:&quot;SeriesGroup&quot;,&quot;Type&quot;:&quot;line&quot;,&quot;GraphCsvData&quot;:&quot;\ufeffQuarter,Dec-2003,Mar-2004,Jun-2004,Sep-2004,Dec-2004,Mar-2005,Jun-2005,Sep-2005,Dec-2005,Mar-2006,Jun-2006,Sep-2006,Dec-2006,Mar-2007,Jun-2007,Sep-2007,Dec-2007,Mar-2008,Jun-2008,Sep-2008,Dec-2008,Mar-2009,Jun-2009,Sep-2009,Dec-2009,Mar-2010,Jun-2010,Sep-2010,Dec-2010,Mar-2011,Jun-2011,Sep-2011,Dec-2011,Mar-2012,Jun-2012,Sep-2012,Dec-2012,Mar-2013,Jun-2013,Sep-2013,Dec-2013,Mar-2014,Jun-2014,Sep-2014,Dec-2014,Mar-2015,Jun-2015,Sep-2015,Dec-2015,Mar-2016,Jun-2016,Sep-2016,Dec-2016,Mar-2017,Jun-2017,Sep-2017,Dec-2017,Mar-2018,Jun-2018,Sep-2018,Dec-2018,Mar-2019,Jun-2019,Sep-2019,Dec-2019,Mar-2020,Jun-2020,Sep-2020,Dec-2020,Mar-2021,Jun-2021,Sep-2021,Dec-2021,Mar-2022,Jun-2022,Sep-2022,Dec-2022,Mar-2023,Jun-2023,Sep-2023,Dec-2023,Mar-2024,Jun-2024,Sep-2024,Dec-2024,Mar-2025,Jun-2025,Sep-2025,Dec-2025\r\n\&quot;Migrant arrivals (from AU to NZ, estimated from Stats NZ data)\&quot;,6663,5463,4347,4438,5995,4853,3879,4167,5765,4686,3681,4276,5915,4738,3808,4252,5740,4502,3620,4019,5844,4702,4180,4758,6509,5264,4442,4859,6244,5002,3811,4328,5990,4812,3959,4933,7230,6079,5458,6801,9277,7553,6325,7402,10088,8001,6791,7802,10426,8448,6559,7477,9997,7662,6203,6712,9018,6894,5591,6499,8382,6706,6030,7391,10577,8774,1863,5491,5094,4160,6940,2521,3035,4471,5590,4765,5385,4448,3283,3696,4568,4030,3381,3994,5356,4498,3962,4596,5933\r\n\&quot;Migrant departures (from NZ to AU, estimated from ABS data)\&quot;,13078,11566,8913,9021,10580,12008,10313,9918,11306,11768,1 on-New Zealand citizens.&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;134624&quot;,&quot;Title&quot;:&quot;IM June 2026 \u2013 g8 \u2013 Estimated migration between New Zealand and Australia, by citizenship, quarterly, December 2003\u2013December 2025&quot;,&quot;ClassName&quot;:&quot;GraphTableBlock&quot;,&quot;ShowBlockTitle&quot;:0,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;xAxisTitle&quot;:null,&quot;yAxisTitle&quot;:&quot;Number&quot;,&quot;yAxisDualRightTitle&quot;:null,&quot;GraphMetadata&quot;:&quot;&lt;p&gt;&lt;span class=\&quot;u-font-size-small\&quot;&gt;Stats NZ estimates from the March 2025 month, and Australian Bureau of Statistics (ABS) estimates from the March 2025 quarter, are provisional and subject to revision. &lt;br&gt;&lt;\/span&gt;&lt;\/p&gt;\n&lt;p&gt;&lt;span class=\&quot;u-font-size-small\&quot;&gt;The country of last\u202fprevious\u202fresidence (CLPR) of migrants arriving in New Zealand and Australia is not always known.&amp;nbsp;&lt;br&gt;&lt;\/span&gt;&lt;\/p&gt;\n&lt;p&gt;&lt;span class=\&quot;u-font-size-small\&quot;&gt;To estimate net migration using the two series \u2018Estimated migrant arrivals to Australia \u2026 (quarterly)\u2019 and \u2018Estimated migrant arrivals by citizenship, visa type and CLPR, 12\/16-month rule (quarterly)\u2026\u2019, an allowance for non-response to the CLPR question on both New Zealand and Australian arrival cards has been made.&amp;nbsp;&lt;br&gt;&lt;\/span&gt;&lt;\/p&gt;\n&lt;p&gt;&lt;span class=\&quot;u-font-size-small\&quot;&gt;For \u2018Estimated migrant arrivals by citizenship, visa type and CLPR\u2026\u2019 non-response to CLPR is prorated based on the distribution of those with a CLPR by citizenship (\u2018NZ\u2019,\u202f\u2018non-NZ\u2019). These estimates will differ from the\u202fInfoshare\u202fseries, which makes no adjustment for CLPR non-response.&amp;nbsp;&lt;br&gt;&lt;\/span&gt;&lt;\/p&gt;\n&lt;p&gt;&lt;span class=\&quot;u-font-size-small\&quot;&gt;For \u2018Estimated migrant arrivals to Australia\u2026\u2019 the proration is based on a combination of birthplace (\u2018NZ\u2019,\u202f\u2018non-NZ\u2019) and citizenship (\u2018NZ\u2019,\u202f\u2018non-NZ\u2019).&amp;nbsp;&lt;br&gt;&lt;\/span&gt;&lt;\/p&gt;\n&lt;p&gt;&lt;span class=\&quot;u-font-size-small\&quot;&gt;Owing to rounding, individual figures may not sum to totals published elsewhere.&amp;nbsp;&lt;br&gt;&lt;\/span&gt;&lt;\/p&gt;&quot;,&quot;SeriesData&quot;:[{&quot;ID&quot;:35682,&quot;Title&quot;:&quot;Estimated migration between New Zealand and Australia, by citizenship, quarterly, December 2003\u2013December 2025&quot;,&quot;ClassName&quot;:&quot;SeriesGroup&quot;,&quot;Type&quot;:&quot;line&quot;,&quot;GraphCsvData&quot;:&quot;\ufeffQuarter,Dec-2003,Mar-2004,Jun-2004,Sep-2004,Dec-2004,Mar-2005,Jun-2005,Sep-2005,Dec-2005,Mar-2006,Jun-2006,Sep-2006,Dec-2006,Mar-2007,Jun-2007,Sep-2007,Dec-2007,Mar-2008,Jun-2008,Sep-2008,Dec-2008,Mar-2009,Jun-2009,Sep-2009,Dec-2009,Mar-2010,Jun-2010,Sep-2010,Dec-2010,Mar-2011,Jun-2011,Sep-2011,Dec-2011,Mar-2012,Jun-2012,Sep-2012,Dec-2012,Mar-2013,Jun-2013,Sep-2013,Dec-2013,Mar-2014,Jun-2014,Sep-2014,Dec-2014,Mar-2015,Jun-2015,Sep-2015,Dec-2015,Mar-2016,Jun-2016,Sep-2016,Dec-2016,Mar-2017,Jun-2017,Sep-2017,Dec-2017,Mar-2018,Jun-2018,Sep-2018,Dec-2018,Mar-2019,Jun-2019,Sep-2019,Dec-2019,Mar-2020,Jun-2020,Sep-2020,Dec-2020,Mar-2021,Jun-2021,Sep-2021,Dec-2021,Mar-2022,Jun-2022,Sep-2022,Dec-2022,Mar-2023,Jun-2023,Sep-2023,Dec-2023,Mar-2024,Jun-2024,Sep-2024,Dec-2024,Mar-2025,Jun-2025,Sep-2025,Dec-2025\r\nMigrant arrivals from AU to NZ (NZ citizens),4364,3045,2496,2676,4023,2759,2305,2538,3911,2761,2252,2768,3921,2806,2334,2742,3979,2632,2223,2682,4202,2984,2825,3366,4778,3453,2989,3345,4451,3007,2406,2983,4186,3035,2700,3527,5353,3997,3728,4967,6908,5027,4524,5502,7646,5401,4745,5680,7815,5724,4546,5421,7382,5081,4217,4723,6449,4459,3744,4538,5747,4072,3790,4865,7261,5682,1673,4953,4384,3460,4887,1989,2464,3699,3622,3202,3740,2524,2014,2386,3211,2490,2180,2746 300,1783,1704,2167,1879,1697,1733,2257,1875,1447,1723,2188,1715,1331,1551,1839\r\nNet migration (non-NZ citizens),-622,267,377,160,61,-107,-262,-140,-470,-103,-367,-542,-460,-73,-325,-383,-688,-280,-432,-766,-775,-520,-384,-442,-638,-236,-336,-544,-615,-170,-324,-388,-428,-73,-391,-316,-209,286,293,427,551,1084,652,576,642,1003,729,633,635,1033,597,259,286,755,370,202,330,688,407,230,563,819,471,431,19,755,-125,-2,-769,-797,-222,-419,-773,-528,185,-141,-522,45,-428,-423,-901,-335,-246,-475,-648,-78,20,-119,-96\r\n&quot;}],&quot;GraphType&quot;:&quot;line&quot;,&quot;Presentation&quot;:&quot;graphTable&quot;,&quot;GraphHeading&quot;:&quot;Estimated migration between New Zealand and Australia, by citizenship, quarterly, December 2003\u2013December 2025&quot;,&quot;showLegend&quot;:true,&quot;SourceCredit&quot;:&quot;Stats NZ&quot;,&quot;Footnote&quot;:&quot;See metadata tab for more information about this graph. Key: AU \u2013 Australia, NZ \u2013 New Zealand.&quot;,&quot;GeoLevelView&quot;:null,&quot;Action&quot;:{&quot;ActionText&quot;:null,&quot;ActionHref&quot;:{&quot;Url&quot;:&quot;&quot;,&quot;Target&quot;:&quot;_self&quot;}}},{&quot;ID&quot;:&quot;134769&quot;,&quot;Title&quot;:&quot;International migration: June 2026 \u2013 key facts 8&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;p&gt;In the December 2025 year, 64 percent of New Zealand citizen migrant departures were to Australia.&lt;\/p&gt;\n&lt;p&gt;Of New Zealand citizens who migrated to Australia in the December 2025 year, 35 percent were born outside New Zealand.&lt;\/p&gt;\n&lt;p&gt;&lt;a href=\&quot;\/news\/net-migration-loss-to-australia-in-2025\/\&quot;&gt;Net migration loss to Australia in 2025&lt;\/a&gt; (published in July 2026 and based on provisional data to December 2025) has more information.&lt;\/p&gt;\n&lt;p&gt;These net migration estimates draw on two Infoshare series (select \u2018Tourism\u2019, then \u2018International Travel and Migration \u2013 ITM\u2019):&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Estimated migrant arrivals by citizenship, visa type, and CLPR, 12\/16-month rule (Quarterly) \u2013 this uses Stats NZ monthly estimates currently available to June 2026.&lt;\/li&gt;\n&lt;li&gt;Estimated migrant arrivals to Australia by CLPR, citizenship, and birthplace (Quarterly) \u2013 this uses Australian Bureau of Statistics quarterly estimates currently available to December 2025. Data for the March 2026 quarter will be available in late September 2026.&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;p&gt;As the country of last previous residence (CLPR) of migrants arriving in New Zealand and Australia is not always known, an allowance for non-response to the CLPR question on both New Zealand and Australian arrival cards has been made.&lt;\/p&gt;\n&lt;h2&gt;&lt;a id=\&quot;revisions\&quot;&gt;&lt;\/a&gt;Latest revisions&lt;\/h2&gt;\n&lt;p&gt;Migration estimates from March 2025 are provisional and subject to revision because it is not yet known whether some travellers are migrants or non-migrants.&lt;\/p&gt;\n&lt;p&gt;&lt;a href=\&quot;\/information-releases\/international-migration-june-2026\/#why\&quot;&gt;Why migration estimates change&lt;\/a&gt; has more information.&lt;\/p&gt;\n&lt;p&gt;From August 2024 onwards, starting with the release of June 2024 estimates, a new training period was implemented for the international migration model.&lt;\/p&gt;\n&lt;p&gt;&lt;a href=\&quot;\/methods\/adjusting-the-training-window-for-the-international-migration-model\/\&quot;&gt;Adjusting the training window for the international migration model&lt;\/a&gt; (published 6 August 2024) and &lt;a href=\&quot;\/information-releases\/international-migration-june-2024\/#training-period\&quot;&gt;International migration: June 2024&lt;\/a&gt; (published 13 August 2024) have more information on the change of training period.&lt;\/p&gt;\n&lt;p&gt;We encourage customers to make their own judgement on whether to use provisional migration estimates for the latest months, which have higher uncertainty, or provisional migration estimates for older months, which have lower uncertainty. Annual arrival and departure estimates are subject to notably less revision at 5 to 6 months after the reference period.&lt;\/p&gt;\n&lt;p&gt;&lt;a href=\&quot;\/about-us\/what-we-do\/current-projects\/migration-data-transformation-project\/#latestcomparison\&quot;&gt;Comparison of provisional and final migration estimates: August 2017 to June 2026&lt;\/a&gt;&lt;a href=\&quot;https:\/\/www.stats.govt.nz\/about-us\/what-we-do\/current-projects\/migration-data-transformation-project\/#latestcomparison\&quot;&gt;&lt;\/a&gt; contains a history of published migration estimates and revisions.&lt;\/p&gt;\n&lt;p&gt;This month, revisions to the preceding month (May 2026) were:&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;migrant arrivals up 200 (2 percent). The average revision size to the preceding month was 200 (1 percent), and revisions were generally downwards, over the previous 12 months (May 2025 to April 2026).&lt;\/li&gt;\n&lt;li&gt;migrant departures up 100 (1 percent). The average revision size to the preceding month was 300 (3 percent), and revisions were generally upwards, over the previous 12 months.&lt;\/li&gt;\n&lt;li&gt;net migration up 100. The average revision size to the preceding month was 400, and revisions were generally downwards, over the previous 12 months.&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;p&gt;&lt;img width=\&quot;3425\&quot; height=\&quot;1732\&quot; alt=\&quot;Three graphs show Estimated migration by direction, monthly, November 2018\u2013June 2026. See link to text alternative under image.\&quot; src=\&quot;\/assets\/Uploads\/International-migration\/International-migration-June-2026\/Download-data\/estimated-migration-by-direction-monthly-november-2018-june-2026.png\&quot; loading=\&quot;lazy\&quot; class=\&quot;ss-htmleditorfield-file image\&quot;&gt;\n\n&lt;\/p&gt;\n&lt;p&gt;&lt;a href=\&quot;\/information-releases\/international-migration-june-2026\/#text-alt-2\&quot;&gt;Text alternative for graphs Estimated migration by direction, monthly, November 2018\u2013June 2026&lt;\/a&gt;&lt;\/p&gt;\n&lt;p&gt;This month, revisions to the preceding year (ended May 2026) were:&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;migrant arrivals down 300 (less than 1 percent). The average revision size to the preceding year was 1,800 (1 percent), and revisions were generally downwards, over the previous 12 months (year ended May 2025 to year ended April 2026).&lt;\/li&gt;\n&lt;li&gt;migrant departures up 1,300 (1 percent). The average revision size to the preceding year was 1,500 (1 percent), with half of revisions upwards and half downwards, over the previous 12 months.&lt;\/li&gt;\n&lt;li&gt;net migration down 1,600. The average revision size to the preceding year was 2,300, and revisions were generally downwards, over the previous 12 months.&lt;\/li&gt;\n&lt;\/ul&gt;&quot;},{&quot;ID&quot;:&quot;21660&quot;,&quot;Title&quot;:&quot;International migration \u2013 more data&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;More data&lt;\/h2&gt;&lt;p&gt;Use &lt;a href=\&quot;http:\/\/infoshare.stats.govt.nz\/\&quot;&gt;Infoshare&lt;\/a&gt; to access time-series data for international travel and migration:&lt;\/p&gt;&lt;p&gt;Subject category: Tourism&lt;br&gt;Group: International travel and migration \u2013 ITM&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;21663&quot;,&quot;Title&quot;:&quot;International migration \u2013 metadata&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;Definitions and metadata&lt;\/h2&gt;\n&lt;p&gt;&lt;a href=\&quot;https:\/\/datainfoplus.stats.govt.nz\/Item\/nz.govt.stats\/e2190954-9bd0-4ab9-81bd-4a5407de3f19\&quot;&gt;International migration \u2013 DataInfo+&lt;\/a&gt; gives general methodology used to produce international travel and migration statistics.&lt;\/p&gt;\n&lt;p&gt;&lt;a href=\&quot;https:\/\/datainfoplus.stats.govt.nz\/item\/nz.govt.stats\/cb9c5a8d-721f-412a-9127-d2457c8545a1\&quot;&gt;International migration concepts \u2013 DataInfo+&lt;\/a&gt; gives definitions of terms used in this release.&lt;\/p&gt;\n&lt;p&gt;&lt;a href=\&quot;https:\/\/datainfoplus.stats.govt.nz\/item\/nz.govt.stats\/ad09fd57-0e63-43b1-8341-0edd00109d91\&quot;&gt;Subnational short-term NZ-resident arrivals \u2013 DataInfo+&lt;\/a&gt; gives methodology for determining the New Zealand-location information in short-term New Zealand-resident arrival records.&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;134782&quot;,&quot;Title&quot;:&quot;International migration: June 2026 \u2013 metadata 2&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;Provisional migration estimates&lt;\/h2&gt;\n&lt;p&gt;Comparisons between the June 2026 and 2025 months and years use the latest provisional estimates for each period.&lt;\/p&gt;\n&lt;p&gt;The provisional estimates have 95 percent confidence intervals (\u00b1) beside them \u2013 the wider the interval, the greater the uncertainty about the estimate. However, these intervals reflect the model uncertainty, not the extent of future revisions to provisional data.&lt;\/p&gt;\n&lt;p&gt;Migration estimates in more recent months have greater uncertainty and are therefore subject to larger revisions than estimates for earlier periods.&lt;\/p&gt;\n&lt;p&gt;Provisional migration estimates are revised each month until they are finalised after 16 months.&lt;\/p&gt;\n&lt;p&gt;&lt;a href=\&quot;\/about-us\/what-we-do\/current-projects\/migration-data-transformation-project\/\&quot;&gt;Migration data transformation&lt;\/a&gt;&lt;a href=\&quot;https:\/\/www.stats.govt.nz\/about-us\/what-we-do\/current-projects\/migration-data-transformation-project\/\&quot;&gt;&lt;\/a&gt; has more information about the migration estimates, including the 12\/16-month rule and a monthly summary of the number of border movements, the number requiring modelling as migrants or non-migrants, and the history of revisions to migration estimates.&lt;\/p&gt;\n&lt;p&gt;&lt;a href=\&quot;https:\/\/www.stats.govt.nz\/about-us\/what-we-do\/current-projects\/migration-data-transformation-project\/#latestcomparison\&quot;&gt;Comparison of provisional and final migration estimates: August 2017 to June 2026&lt;\/a&gt; also has more information.&lt;\/p&gt;\n&lt;h2&gt;&lt;a id=\&quot;why\&quot;&gt;&lt;\/a&gt;Why migration estimates change&lt;\/h2&gt;\n&lt;p&gt;The outcomes-based measure of migration with provisional and final estimates is the official way we measure migration in New Zealand.&lt;\/p&gt;\n&lt;p&gt;&lt;a href=\&quot;https:\/\/www.stats.govt.nz\/news\/international-migration-uses-new-official-measure\/\&quot;&gt;International migration uses new official measure&lt;\/a&gt; has more information.&lt;\/p&gt;\n&lt;p&gt;To classify a border crossing as a migrant movement, we need to observe up to 16 months of travel history, and it takes 17 months before final migration estimates are available, using the &lt;a href=\&quot;https:\/\/www.stats.govt.nz\/about-us\/what-we-do\/current-projects\/migration-data-transformation-project\/#faq\&quot;&gt;12\/16-month rule&lt;\/a&gt;.&lt;\/p&gt;\n&lt;p&gt;To produce timely results, we use a statistical model to produce provisional migration estimates. As new data becomes available each month, the provisional migration model has more information about the border crossings it is trying to estimate. This causes shifts in the estimated number of migrant arrivals and migrant departures, and thus changes in the net migration estimates.&lt;\/p&gt;\n&lt;p&gt;&lt;strong&gt;&lt;a id=\&quot;text-alt-1\&quot;&gt;&lt;\/a&gt;Text alternative for diagram International migration estimates (provisional), year ended June 2026&lt;\/strong&gt;&lt;\/p&gt;\n&lt;p&gt;Diagram shows outcomes-based (provisional) estimates of migration, by citizenship (New Zealand or non-New Zealand) for the year ended June 2026. Overall, net migration is 17,600, made up of a net loss of 37,700 New Zealand citizens (based on 26,200 migrant arrivals, a 6 percent increase on the year ended June 2025, and 63,900 migrant departures, a 3 percent decrease) and a net gain of 55,300 non-New Zealand citizens (based on 104,500 migrant arrivals, a 0 percent change on the year ended June 2025, and 49,200 migrant departures, a 7 percent decrease). Estimates are provisional as of 14 August 2026. Source: Stats NZ.&lt;\/p&gt;\n&lt;p&gt;&lt;strong&gt;&lt;a id=\&quot;text-alt-2\&quot;&gt;&lt;\/a&gt;Text alternative for graphs Estimated migration by direction, monthly, November 2018\u2013June 2026&lt;\/strong&gt;&lt;\/p&gt;\n&lt;p&gt;Graphs show monthly revisions to provisional migrant arrivals, migrant departures, and net migration for each month from November 2018 to June 2026. The data is shown in three separate line graphs arranged vertically, with migrant arrivals (top), migrant departures (middle), and net migration (bottom). The vertical axis shows estimated number of migrants. Months are labelled on the horizontal axis. Source: Stats NZ.&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;133962&quot;,&quot;Title&quot;:&quot;Infoshare is being replaced by Aotearoa Data Explorer&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;Infoshare is being replaced by Aotearoa Data Explorer&lt;\/h2&gt;\n&lt;p&gt;&lt;a id=\&quot;menurj4r\&quot; title=\&quot;https:\/\/www.stats.govt.nz\/tools\/infoshare-is-being-replaced-by-aotearoa-data-explorer\/\&quot; rel=\&quot;noopener noreferrer\&quot; href=\&quot;https:\/\/www.stats.govt.nz\/tools\/infoshare-is-being-replaced-by-aotearoa-data-explorer\/\&quot; target=\&quot;_blank\&quot;&gt;Infoshare is being replaced by Aotearoa Data Explorer&lt;\/a&gt;. Stay informed and get support with this change by joining our customer group at &lt;a href=\&quot;mailto:cdtp@stats.govt.nz?subject=CDTP%20customer%20group\&quot;&gt;cdtp@stats.govt.nz&lt;\/a&gt;.&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;21666&quot;,&quot;Title&quot;:&quot;International migration \u2013 media enquiries&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;Media enquiries&lt;\/h2&gt;\n&lt;p&gt;Media team&lt;br&gt;&lt;a href=\&quot;mailto:media@stats.govt.nz?subject=International%20migration%20%E2%80%93%20media%20enquiries\&quot;&gt;media@stats.govt.nz&lt;\/a&gt;&lt;br&gt;&lt;a title=\&quot;Phone 021 285 9191\&quot; href=\&quot;tel:+64212859191\&quot;&gt;021 285 9191&lt;\/a&gt;&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;21669&quot;,&quot;Title&quot;:&quot;International migration \u2013 technical enquiries&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;Technical enquiries&lt;\/h2&gt;\n&lt;p&gt;Travel, migration, and housing team&lt;br&gt;&lt;a rel=\&quot;noopener noreferrer\&quot; href=\&quot;mailto:info@stats.govt.nz?subject=International%20migration%20%E2%80%93%20technical%20enquiries\&quot; target=\&quot;_blank\&quot;&gt;info@stats.govt.nz&lt;\/a&gt;&lt;br&gt;&lt;a href=\&quot;tel:+6449314600\&quot;&gt;04 931 4600&lt;\/a&gt;&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;21672&quot;,&quot;Title&quot;:&quot;ISSN International migration&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;p&gt;ISSN 2624-2702&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;134771&quot;,&quot;Title&quot;:&quot;International migration:
