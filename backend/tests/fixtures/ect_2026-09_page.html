uot;Trend\&quot;,\&quot;7053276000\&quot;,\&quot;7048930000\&quot;,\&quot;7039663000\&quot;,\&quot;7027896000\&quot;,\&quot;7013900000\&quot;,\&quot;6991658000\&quot;,\&quot;6959320000\&quot;,\&quot;6917888000\&quot;,\&quot;6876597000\&quot;,\&quot;6844398000\&quot;,\&quot;6826416000\&quot;,\&quot;6827169000\&quot;,\&quot;6844947000\&quot;,\&quot;6873020000\&quot;,\&quot;6900187000\&quot;,\&quot;6914650000\&quot;,\&quot;6913978000\&quot;,\&quot;6900684000\&quot;,\&quot;6882199000\&quot;,\&quot;6867216000\&quot;,\&quot;6860814000\&quot;,\&quot;6866132000\&quot;,\&quot;6885620000\&quot;,\&quot;6911105000\&quot;,\&quot;6933657000\&quot;,\&quot;6953114000\&quot;,\&quot;6969396000\&quot;,\&quot;6984312000\&quot;,\&quot;6998137000\&quot;,\&quot;7010663000\&quot;,\&quot;7022934000\&quot;,\&quot;7032347000\&quot;,\&quot;7037395000\&quot;,\&quot;7034759000\&quot;,\&quot;7024358000\&quot;,\&quot;7011301000\&quot;,\&quot;7000209000\&quot;\n&quot;}],&quot;GraphType&quot;:&quot;line&quot;,&quot;Presentation&quot;:&quot;graphTable&quot;,&quot;GraphHeading&quot;:&quot;\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00adRetail card spending ($), September 2023\u2013September 2026&quot;,&quot;showLegend&quot;:true,&quot;SourceCredit&quot;:&quot;Stats NZ&quot;,&quot;Footnote&quot;:null,&quot;GeoLevelView&quot;:null,&quot;Action&quot;:{&quot;ActionText&quot;:null,&quot;ActionHref&quot;:{&quot;Url&quot;:&quot;&quot;,&quot;Target&quot;:&quot;_self&quot;}}},{&quot;ID&quot;:&quot;135591&quot;,&quot;Title&quot;:&quot;Electronic card transactions: September 2026 \u2013 key facts 2&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;p&gt;By retail spending category, movements were:&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;hospitality, down $33 million (2.3 percent)&lt;\/li&gt;\n&lt;li&gt;apparel, down $6.7 million (2.0 percent)&lt;\/li&gt;\n&lt;li&gt;durables, down $6.6 million (0.4 percent)&lt;\/li&gt;\n&lt;li&gt;motor vehicles (excluding fuel), up $1.2 million (0.6 percent)&lt;\/li&gt;\n&lt;li&gt;consumables, up $8.0 million (0.3 percent)&lt;\/li&gt;\n&lt;li&gt;fuel, up $15 million (2.9 percent).&lt;\/li&gt;\n&lt;\/ul&gt;&quot;},{&quot;ID&quot;:&quot;135555&quot;,&quot;Title&quot;:&quot;ECT Sep 26 \u2013 G2 \u2013 \u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00adPercentage change in seasonally adjusted card transaction values, by industry, August 2026\u2013September 2026&quot;,&quot;ClassName&quot;:&quot;GraphTableBlock&quot;,&quot;ShowBlockTitle&quot;:0,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;xAxisTitle&quot;:&quot;Industry (ANZSIC06)&quot;,&quot;yAxisTitle&quot;:&quot;Percentage change&quot;,&quot;yAxisDualRightTitle&quot;:null,&quot;GraphMetadata&quot;:null,&quot;SeriesData&quot;:[{&quot;ID&quot;:35852,&quot;Title&quot;:&quot;Percentage change in seasonally adjusted card transaction values, by industry, August 2026\u2013September 2026&quot;,&quot;ClassName&quot;:&quot;SeriesGroup&quot;,&quot;Type&quot;:&quot;bar&quot;,&quot;GraphCsvData&quot;:&quot;Industry (ANZSIC06),Consumables,Durables,Hospitality,Apparel,Motor vehicles excl. fuel,Fuel,Non-retail excl. services,Services\r\n%,0.3,-0.4,-2.3,-2,0.6,2.9,-1.1,-1.5\r\n&quot;}],&quot;GraphType&quot;:&quot;bar&quot;,&quot;Presentation&quot;:&quot;graphTable&quot;,&quot;GraphHeading&quot;:&quot;Percentage change in seasonally adjusted card transaction values, by industry, August 2026\u2013September 2026&quot;,&quot;showLegend&quot;:false,&quot;SourceCredit&quot;:&quot;Stats NZ&quot;,&quot;Footnote&quot;:&quot;ANZSIC06 \u2013 Australian and New Zealand Standard Industrial Classification 2006. &quot;,&quot;GeoLevelView&quot;:null,&quot;Action&quot;:{&quot;ActionText&quot;:null,&quot;ActionHref&quot;:{&quot;Url&quot;:&quot;&quot;,&quot;Target&quot;:&quot;_self&quot;}}},{&quot;ID&quot;:&quot;135592&quot;,&quot;Title&quot;:&quot;Electronic card transactions: September 2026 \u2013 key facts 3&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;p&gt;Note, the seasonally adjusted series are adjusted independently of each other; therefore, the sum of the component categories may differ from the total.&lt;\/p&gt;\n&lt;p&gt;The non-retail (excluding services) category decreased by $25 million (1.1 percent) from August 2026. This category includes medical and other health care, travel and tour arrangement, postal and courier delivery, and other non-retail industries.&lt;\/p&gt;\n&lt;p&gt;The services category was down $5.9 million (1.5 percent). This category includes repair and maintenance, and personal care, funeral, and other personal services.&lt;\/p&gt;\n&lt;p&gt;The total value of electronic card spending, including the two non-retail categories (services and other non-retail), decreased from August 2026, down $51 million (0.5 percent).&lt;\/p&gt;\n&lt;p&gt;In actual terms, cardholders made 167 million transactions across all industries in September 2026, with an average value of $55 per transaction. The total amount spent using electronic cards was $9.2 billion.&lt;\/p&gt;\n&lt;h2&gt;September 2026 quarter&lt;\/h2&gt;\n&lt;p&gt;Changes in the seasonally adjusted value of retail electronic card transactions for the September 2026 quarter (compared with the June 2026 quarter) were:&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;spending in the retail industries increased $14 million (0.1 percent)&lt;\/li&gt;\n&lt;li&gt;spending in the core retail industries increased $79 million (0.4 percent).&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;p&gt;By spending category, the movements were:&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;consumables, up $109 million (1.3 percent)&lt;\/li&gt;\n&lt;li&gt;apparel, up $2.6 million (0.3 percent)&lt;\/li&gt;\n&lt;li&gt;motor vehicles (excluding fuel), up $1.8 million (0.3 percent)&lt;\/li&gt;\n&lt;li&gt;hospitality, down $7.1 million (0.2 percent)&lt;\/li&gt;\n&lt;li&gt;durables, down $24 million (0.5 percent)&lt;\/li&gt;\n&lt;li&gt;fuel, down $71 million (4.4 percent).&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;p&gt;The non-retail (excluding services) category was up $90 million (1.3 percent) and the services category was up $4.0 million (0.3 percent).&lt;\/p&gt;\n&lt;p&gt;The total value of electronic card spending, including the two non-retail categories (services and other non-retail) increased by $82 million (0.3 percent) compared with the June 2026 quarter.&lt;\/p&gt;\n&lt;h2&gt;About the data&lt;\/h2&gt;\n&lt;p&gt;ECT figures are based on aggregated administrative data generated in the process of administering New Zealand-based electronic transactions.&lt;\/p&gt;\n&lt;p&gt;Stats NZ does not control how data providers classify their merchants, and we are unable to see which merchants sit within each industry.&lt;\/p&gt;\n&lt;p&gt;Some transactions cannot be categorised by data providers and are therefore excluded from ECT results.&lt;\/p&gt;\n&lt;p&gt;The ECT figures reflect the data provided, which can change over time. For example, when merchants switch to data providers not covered by Stats NZ, coverage may shift and reported totals may change.&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;1330&quot;,&quot;Title&quot;:&quot;Electronic card transactions \u2013 more data&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;More data&lt;\/h2&gt;&lt;p&gt;Use &lt;a href=\&quot;http:\/\/infoshare.stats.govt.nz\&quot;&gt;Infoshare&lt;\/a&gt; to access the electronic card transactions time series:&lt;\/p&gt;&lt;p&gt;Subject category:&amp;nbsp;Economic indicators&amp;nbsp;&lt;br&gt;Group:&amp;nbsp;Electronic card transactions (ANZSIC06) \u2013 ECT&lt;\/p&gt;&quot;},{&quot;ID&
