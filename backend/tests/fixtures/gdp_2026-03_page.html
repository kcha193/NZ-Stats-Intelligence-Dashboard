 for price inflation).&lt;\/p&gt;\n&lt;p&gt;In the March 2026 quarter, compared with the December 2025 quarter:&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;expenditure on GDP rose 1.4 percent&lt;\/li&gt;\n&lt;li&gt;income GDP rose 1.7 percent.&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;h2&gt;New Zealand economy up in March 2026 quarter&lt;\/h2&gt;\n&lt;p&gt;Economic activity rose 0.8 percent in the March 2026 quarter as measured by gross domestic product. This follows a 0.5 percent rise in the December 2025 quarter. GDP rose 0.8 percent over the year ended March 2026, compared with the year ended March 2025.&lt;\/p&gt;\n&lt;p&gt;Expenditure on GDP rose 1.0 percent in the March 2026 quarter, following a 0.4 percent rise in the December 2025 quarter. Expenditure on GDP rose 1.3 percent over the year ended March 2026, compared with the year ended March 2025.&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;133874&quot;,&quot;Title&quot;:&quot;GDP Mar 26 qtr \u2013 G1 \u2013 Gross domestic product, quarterly and annual growth rates, chain volume, September 2022\u2013March 2026&quot;,&quot;ClassName&quot;:&quot;GraphTableBlock&quot;,&quot;ShowBlockTitle&quot;:0,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;xAxisTitle&quot;:&quot;Quarter&quot;,&quot;yAxisTitle&quot;:&quot;Percent&quot;,&quot;yAxisDualRightTitle&quot;:null,&quot;GraphMetadata&quot;:null,&quot;SeriesData&quot;:[{&quot;ID&quot;:35513,&quot;Title&quot;:&quot;Quarterly growth&quot;,&quot;ClassName&quot;:&quot;SeriesGroup&quot;,&quot;Type&quot;:&quot;column&quot;,&quot;GraphCsvData&quot;:&quot;Quarter,Sept-22,Dec-22,Mar-23,Jun-23,Sept-23,Dec-23,Mar-24,Jun-24,Sept-24,Dec-24,Mar-25,Jun-25,Sept-25,Dec-25,Mar-26\r\nQuarterly growth (%),1.9,0.2,-0.1,1,0.1,0.5,0,-0.5,-1.2,0.1,0.9,-0.7,0.9,0.5,0.8\r\n&quot;},{&quot;ID&quot;:35514,&quot;Title&quot;:&quot;Annual growth&quot;,&quot;ClassName&quot;:&quot;SeriesGroup&quot;,&quot;Type&quot;:&quot;line&quot;,&quot;GraphCsvData&quot;:&quot;Quarter,Sept-22,Dec-22,Mar-23,Jun-23,Sept-23,Dec-23,Mar-24,Jun-24, td width=\&quot;182\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p&gt;Less imports of goods and services&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;122\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;1.3&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;105\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;4.2&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;189\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;5.4&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td width=\&quot;182\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p&gt;&lt;strong&gt;Expenditure on gross domestic product&lt;\/strong&gt;&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;122\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;&lt;strong&gt;0.4&lt;\/strong&gt;&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;105\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;&lt;strong&gt;1.0&lt;\/strong&gt;&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;189\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;&lt;strong&gt;1.3&lt;\/strong&gt;&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td colspan=\&quot;4\&quot; width=\&quot;598\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p&gt;&lt;strong&gt;Note:&lt;\/strong&gt; For the March 2026 quarter, the measures of average annual growth compare activity over the most recent year (sum of activity in June 2025 to March 2026 quarters) with activity over the previous year (sum of activity in June 2024 to March 2025 quarters).&lt;\/p&gt;\n&lt;p&gt;&amp;nbsp;&lt;\/p&gt;\n&lt;p&gt;YE \u2013 year ended&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;\/tbody&gt;\n&lt;\/table&gt;&quot;},{&quot;ID&quot;:&quot;133876&quot;,&quot;Title&quot;:&quot;GDP Mar 26 qtr \u2013 G3 \u2013 \u00ad\u00ad\u00ad\u00adChange in expenditure on GDP ($), by component, December 2025\u2013March 2026 quarters\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad&quot;,&quot;ClassName&quot;:&quot;GraphTableBlock&quot;,&quot;ShowBlockTitle&quot;:0,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;xAxisTitle&quot;:&quot;Component&quot;,&quot;yAxisTitle&quot;:&quot;$&quot;,&quot;yAxisDualRightTitle&quot;:null,&quot;GraphMetadata&quot;:null,&quot;SeriesData&quot;:[{&quot;ID&quot;:35516,&quot;Title&quot;:&quot;Change in expenditure on GDP ($), by component, December 2025\u2013March 2026 quarters\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad &quot;,&quot;ClassName&quot;:&quot;SeriesGroup&quot;,&quot;Type&quot;:&quot;bar&quot;,&quot;GraphCsvData&quot;:&quot;Component,Household final consumption expenditure,Private consumption expenditure,General government expenditure,Change in inventories,Gross fixed capital formation,Exports of goods and services,(less) Imports of goods and services\r\nChange ($),211000000,206000000,223000000,27000000,337000000,597000000,1025000000\r\n&quot;}],&quot;GraphType&quot;:&quot;bar&quot;,&quot;Presentation&quot;:&quot;graphTable&quot;,&quot;GraphHeading&quot;:&quot;Change in expenditure on GDP ($), by component, December 2025\u2013March 2026 quarters\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad\u00ad&quot;,&quot;showLegend&quot;:false,&quot;SourceCredit&quot;:&quot;Stats NZ&quot;,&quot;Footnote&quot;:&quot;Seasonally adjusted chain-volume series are in 2009\/2010 prices.&quot;,&quot;GeoLevelView&quot;:null,&quot;Action&quot;:{&quot;ActionText&quot;:null,&quot;ActionHref&quot;:{&quot;Url&quot;:&quot;&quot;,&quot;Target&quot;:&quot;_self&quot;}}},{&quot;ID&quot;:&quot;133952&quot;,&quot;Title&quot;:&quot;Gross domestic product: March 2026 quarter \u2013 key facts 5&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h3&gt;Upwards drivers \u2013 change in expenditure&lt;\/h3&gt;\n&lt;p&gt;Exports of goods and services was up 3.1 percent, driven by:&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;dairy products&lt;\/li&gt;\n&lt;li&gt;other food, beverages, and tobacco.&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;p&gt;Gross fixed capital formation was up 2.0 percent, driven by:&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;plant, machinery, and equipment&lt;\/li&gt;\n&lt;li&gt;other construction.&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;p&gt;Household final consumption expenditure was up 0.5 percent, driven by:&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;spending on services including imputed rents, cultural services, miscellaneous services&lt;\/li&gt;\n&lt;li&gt;spending on durable goods including audio visual etc equipment, used motor vehicles, new motor vehicles.&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;h3&gt;Downwards drivers \u2013 change in expenditure&lt;\/h3&gt;\n&lt;p&gt;Imports of goods and services was up 4.2 percent, driven by:&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;imports of capital goods&lt;\/li&gt;\n&lt;li&gt;imports of consumption goods.&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;h2&gt;New Zealand\u2019s real purchasing power rises in the March 2026 quarter&lt;\/h2&gt;\n&lt;p&gt;In the March 2026 quarter, compared with the December 2025 quarter:&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;real gross national disposable income rose 0.6 percent&lt;\/li&gt;\n&lt;li&gt;real gross national disposable income per capita rose 0.4 percent.&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;p&gt;In the year ended March 2026, compared with the year ended March 2025:&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;annual real gross national disposable income rose 2.1 percent&lt;\/li&gt;\n&lt;li&gt;annual real gross national disposable income per capita rose 1.4 percent.&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;p&gt;While GDP measures economic activity, real gross national disposable income (RGNDI) measures the volumes of goods and services that New Zealand residents have command over \u2013 that is, the real purchasing power of the country\u2019s disposable income. RGNDI is also affected by changes in the terms of trade, the country\u2019s net investment income, and net transfer flows with the rest of the world.&lt;\/p&gt;\n&lt;p&gt;New Zealand\u2019s ability to buy goods and services from its income, RGNDI, rose 0.6 percent in the March 2026 quarter. Net transfer flows increased, terms of trade decreased, and net investment income on our international investments increased.&lt;\/p&gt;\n&lt;p&gt;Over the March 2026 quarter, export prices fell 2.7 percent, while import prices fell 0.7 percent, resulting in a decrease in the terms of trade. A decrease in the terms of trade results in more exports being needed to pay for a given volume of imports. This means that residents can purchase fewer goods and services by volume from the income generated from a given level of domestic production.&lt;\/p&gt;\n&lt;p&gt;The 0.6 percent increase in RGNDI, coupled with a population increase of 0.3 percent over the quarter, increased RGNDI per capita by 0.4 percent in the quarter.&lt;\/p&gt;\n&lt;p&gt;Annually, RGNDI rose 2.1 percent over the year to March 2026, while RGNDI per capita rose 1.4 percent over the year.&lt;\/p&gt;\n&lt;h2&gt;New Zealand and trade partners, March 2026 quarter&lt;\/h2&gt;\n&lt;table class=\&quot;stats-striped\&quot; style=\&quot;border-collapse: collapse; width: 100%; white-space: normal; margin-bottom: 1.474rem;\&quot; cellspacing=\&quot;0\&quot; cellpadding=\&quot;0\&quot;&gt;&lt;caption&gt;&lt;strong&gt;Table 3, Percentage changes in GDP, international comparisons in chain-volume terms, March 2026 quarter and from same quarter previous year (March 2025 quarter)&lt;\/strong&gt;&lt;\/caption&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td width=\&quot;143\&quot; valign=\&quot;bottom\&quot;&gt;\n&lt;p&gt;Country&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;248\&quot; valign=\&quot;bottom\&quot;&gt;\n&lt;p align=\&q &quot; valign=\&quot;top\&quot;&gt;\n&lt;p&gt;Euro area&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;248\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;-0.2&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;209\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;0.3&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td width=\&quot;143\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p&gt;European Union&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;248\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;-0.1&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;209\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;0.7&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td width=\&quot;143\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p&gt;Japan&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;248\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;0.5&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;209\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;0.3&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td width=\&quot;143\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p&gt;OECD \u2013 total&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;248\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;0.2&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;209\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;1.6&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td width=\&quot;143\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p&gt;United Kingdom&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;248\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;0.6&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;209\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;1.1&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td width=\&quot;143\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p&gt;United States&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;248\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;0.4&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;209\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;2.6&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td colspan=\&quot;3\&quot; width=\&quot;600\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p&gt;Data as at 16 June 2026. See &lt;a href=\&quot;https:\/\/stats.oecd.org\/\&quot;&gt;OECD.Stat&lt;\/a&gt; for GDP data covering other countries. Take care when comparing New Zealand\u2019s GDP figures with those of other countries, as the methodology used varies internationally. Stats NZ publishes both \u2018average annual growth\u2019 and \u2018year-on-year\u2019 (change from same quarter previous year) GDP growth rates. \u2018Average annual growth\u2019 is Stats NZ\u2019s preferred measure, but it is not available from the OECD website for all countries each quarter.&lt;\/p&gt;\n&lt;p&gt;&amp;nbsp;&lt;\/p&gt;\n&lt;p&gt;For more information on average annual growth and year-on-year growth, see&amp;nbsp;&lt;a href=\&quot;https:\/\/datainfoplus.stats.govt.nz\/Item\/nz.govt.stats\/9a9295f6-ce5f-4c71-8462-ba6dd01f4dc7?&amp;amp;_ga=2.40369250.1392587584.1663017663-1796918034.1635296758\&quot;&gt;DataInfo+&lt;\/a&gt;.&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;\/tbody&gt;\n&lt;\/table&gt;\n&lt;h2&gt;Quarterly nominal expenditure GDP, March 2026 quarter&lt;\/h2&gt;\n&lt;p&gt;The following movements are in seasonally adjusted nominal terms (not adjusted for price inflation) unless otherwise stated.&lt;\/p&gt;\n&lt;p&gt;Seasonally adjusted nominal expenditure GDP rose 1.4 percent in the March 2026 quarter. The size of the economy was $450 billion for the year ended March 2026.&lt;\/p&gt;\n&lt;h2&gt;Nominal income GDP rises&lt;\/h2&gt;\n&lt;p&gt;Nominal income GDP rose 1.7 percent in the March 2026 quarter, following a 1.8 percent rise in the December 2025 quarter. The rise was driven by a 2.0 percent increase in gross operating surplus and gross mixed income.&lt;\/p&gt;\n&lt;h2&gt;Breakdown of GDP by income&lt;\/h2&gt;\n&lt;table class=\&quot;stats-striped\&quot; style=\&quot;border-collapse: collapse; width: 100%; white-space: normal; margin-bottom: 1.474rem;\&quot; cellspacing=\&quot;0\&quot; cellpadding=\&quot;0\&quot;&gt;&lt;caption&gt;&lt;strong&gt;Table 4, Quarterly and annual average percentage change in GDP, by income in nominal terms, December 2025 and March 2026 quarters&lt;\/strong&gt;&lt;\/caption&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td width=\&quot;177\&quot; valign=\&quot;bottom\&quot;&gt;&amp;nbsp;&lt;\/td&gt;\n&lt;td width=\&quot;125\&quot; valign=\&quot;bottom\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;&lt;strong&gt;December 2025 quarter (updated)&lt;\/strong&gt;&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;106\&quot; valign=\&quot;bottom\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;&lt;strong&gt;March 2026 quarter&lt;\/strong&gt;&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;192\&quot; valign=\&quot;bottom\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;&lt;strong&gt;Annual average (growth over YE March 2026)&lt;\/strong&gt;&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td width=\&quot;177\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p&gt;Compensation of employees&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;125\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;1.4&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;106\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;1.2&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;192\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;1.8&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td width=\&quot;177\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p&gt;Gross operating surplus and gross mixed income&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;125\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;2.3&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;106\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;2.0&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;192\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;6.9&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td width=\&quot;177\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p&gt;Taxes on production and imports&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;125\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;1.1&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;106\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;2.3&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;192\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;4.3&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td width=\&quot;177\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p&gt;Less subsidies&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;125\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;-12.7&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;106\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;1.0&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;192\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;-14.5&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td width=\&quot;177\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p&gt;&lt;strong&gt;Income gross domestic product&lt;\/strong&gt;&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;125\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;&lt;strong&gt;1.8&lt;\/strong&gt;&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;106\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;&lt;strong&gt;1.7&lt;\/strong&gt;&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;td width=\&quot;192\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p align=\&quot;center\&quot;&gt;&lt;strong&gt;4.4&lt;\/strong&gt;&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td colspan=\&quot;4\&quot; width=\&quot;600\&quot; valign=\&quot;top\&quot;&gt;\n&lt;p&gt;&lt;strong&gt;Note:&lt;\/strong&gt; For the March 2026 quarter, the measures of average annual growth compare activity over the most recent year (sum of activity in June 2025 to March 2026 quarters) with activity over the previous year (sum of activity in June 2024 to March 2025 quarters).&lt;\/p&gt;\n&lt;p&gt;&amp;nbsp;&lt;\/p&gt;\n&lt;p&gt;YE \u2013 year ended&lt;\/p&gt;\n&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;\/tbody&gt;\n&lt;\/table&gt;&quot;},{&quot;ID&quot;:&quot;133877&quot;,&quot;Title&quot;:&quot;GDP Mar 26 qtr \u2013 G4 \u2013 \u00ad\u00ad\u00ad\u00adChange in income GDP ($), by component, December 2025\u2013March 2026 quarters&quot;,&quot;ClassName&quot;:&quot;GraphTableBlock&quot;,&quot;ShowBlockTitle&quot;:0,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;xAxisTitle&quot;:&quot;Component&quot;,&quot;yAxisTitle&quot;:&quot;$&quot;,&quot;yAxisDualRightTitle&quot;:null,&quot;GraphMetadata&quot;:null,&quot;SeriesData&quot;:[{&quot;ID&quot;:35517,&quot;Title&quot;:&quot;Change in income GDP ($), by component, December 2025\u2013March 2026 quarters&quot;,&quot;ClassName&quot;:&quot;SeriesGroup&quot;,&quot;Type&quot;:&quot;bar&quot;,&quot;GraphCsvData&quot;:&quot;Component,Compensation of employees,Gross operating surplus and gross mixed income,Taxes on production and imports,(less) Subsidies\r\nChange ($),596000000,1031000000,339000000,5000000\r\n&quot;}],&quot;GraphType&quot;:&quot;bar&quot;,&quot;Presentation&quot;:&quot;graphTable&quot;,&quot;GraphHeading&quot;:&quot;Change in income GDP ($), by component, December 2025\u2013March 2026 quarters&quot;,&quot;showLegend&quot;:false,&quot;SourceCredit&quot;:&quot;Stats NZ&quot;,&quot;Footnote&quot;:&quot;Seasonally adjusted current price series.&quot;,&quot;GeoLevelView&quot;:null,&quot;Action&quot;:{&quot;ActionText&quot;:null,&quot;ActionHref&quot;:{&quot;Url&quot;:&quot;&quot;,&quot;Target&quot;:&quot;_self&quot;}}},{&quot;ID&quot;:&quot;133953&quot;,&quot;Title&quot;:&quot;Gross domestic product: March 2026 quarter \u2013 key facts 6&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;Impact of conflict in the Middle East on GDP&lt;\/h2&gt;\n&lt;p&gt;The measurement of GDP in the March 2026 quarter was not heavily impacted by the Middle East conflict and late-quarter fuel price increases. Our headline measure of GDP is presented in volume terms, with the impact of price change removed from the measurement. Therefore, price changes on their own will not impact GDP.&lt;\/p&gt;\n&lt;p&gt;We are monitoring the suitability of our usual methods for accurate measurement of GDP for future GDP releases where the level of activity in various segments of the economy might be significantly impacted by the Middle East conflict and elevated fuel prices.&lt;\/p&gt;\n&lt;p&gt;&lt;a href=\&quot;\/reports\/economic-impacts-on-new-zealand-from-conflict-in-the-middle-east\/\&quot;&gt;Economic impacts on New Zealand from conflict in the Middle East&lt;\/a&gt; provides further information on the relationship between economic data and the conflict in the Middle East.&lt;\/p&gt;\n&lt;h2&gt;Seasonal adjustment of GDP&lt;\/h2&gt;\n&lt;p&gt;New Zealand\u2019s official measure of economic growth, GDP, is directly seasonally adjusted. Seasonal adjustment of GDP series is in line with international best practice.&lt;\/p&gt;\n&lt;p&gt;Aggregate series can be seasonally adjusted either directly or indirectly. Direct seasonal adjustment is performed by first combining component series to aggregate level, then seasonally adjusting the aggregate series. Indirect seasonal adjustment is performed by first seasonally adjusting component series, then combining the seasonally adjusted component series to aggregate level. One approach may perform better than the other under certain conditions. For example, direct seasonal adjustment typically performs better during significant shocks to a time series. Diagnostic testing supports either approach being appropriate to use for GDP, with neither approach being clearly superior.&lt;\/p&gt;\n&lt;p&gt;We recently published a methods paper presenting a side-by-side comparison of GDP growth rates using direct and indirect seasonal adjustment, to explore the differences in results from each approach.&lt;\/p&gt;\n&lt;p&gt;&lt;a href=\&quot;\/methods\/comparing-direct-and-indirect-seasonal-adjustment-of-gross-domestic-product-gdp\/\&quot;&gt;Comparing direct and indirect seasonal adjustment of gross domestic product (GDP)&lt;\/a&gt; has more information.&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;44&quot;,&quot;Title&quot;:&quot;Gross domestic product GDP \u2013 more data&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;More data&lt;\/h2&gt;&lt;p&gt;Use&amp;nbsp;&lt;a title=\&quot;Link to Stats NZ data tool Infoshare\&quot; href=\&quot;http:\/\/infoshare.stats.govt.nz\/\&quot;&gt;Infoshare&lt;\/a&gt;&amp;nbsp;to access the national accounts&amp;nbsp;time series.&lt;\/p&gt;&lt;p&gt;Subject category: Economic indicators &lt;br&gt;Group: National accounts \u2013 SNA 2008&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;133954&quot;,&quot;Title&quot;:&quot;Gross domestic product: March 2026 quarter \u2013 metadata&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;Definitions and metadata&lt;a href=\&quot;https:\/\/datainfoplus.stats.govt.nz\/Item\/nz.govt.stats\/9a9295f6-ce5f-4c71-8462-ba6dd01f4dc7?_ga=2.225172954.1957942343.1600037239-940604984.1576371829\&quot;&gt;&lt;\/a&gt;&lt;\/h2&gt;\n&lt;p&gt;&lt;a href=\&quot;https:\/\/datainfoplus.stats.govt.nz\/Item\/nz.govt.stats\/9a9295f6-ce5f-4c71-8462-ba6dd01f4dc7?_ga=2.225172954.1957942343.1600037239-940604984.1576371829\&quot;&gt;National accounts quarterlies \u2013 DataInfo+&lt;\/a&gt; provides the general methodology used to produce these statistics.&lt;\/p&gt;\n&lt;p&gt;&lt;a href=\&quot;https:\/\/datainfoplus.stats.govt.nz\/item\/nz.govt.stats\/b8a36978-cd7d-4beb-acb9-699524dcf5bb\/4\&quot;&gt;National accounts quarterlies \u2013 concepts \u2013 DataInfo+&lt;\/a&gt; provides the definitions of terms used in this release.&lt;\/p&gt;\n&lt;p&gt;&lt;a href=\&quot;https:\/\/datainfoplus.stats.govt.nz\/item\/nz.govt.stats\/070e4889-1628-4f53-a8f4-2be380bf1a12\&quot;&gt;Gross domestic product: March 2026 quarter \u2013 changes and data updates \u2013 DataInfo+&lt;\/a&gt; has details of data updates for this release.&lt;\/p&gt;\n&lt;p&gt;&lt;a href=\&quot;\/methods\/overview-of-sources-and-methods-for-quarterly-gross-domestic-product-updates-and-covid-19-adjustments\/\&quot;&gt;Overview of sources and methods for quarterly gross domestic product: Updates and COVID-19 adjustments&lt;\/a&gt;&lt;a href=\&quot;https:\/\/www.stats.govt.nz\/methods\/overview-of-sources-and-methods-for-quarterly-gross-domestic-product-updates-and-covid-19-adjustments\/\&quot;&gt;&lt;\/a&gt; provides an overview of changes to our usual quarterly GDP methods, including alternative data sources and methods we are using to measure the effects of COVID-19 in New Zealand.&lt;\/p&gt;\n&lt;p&gt;&lt;a href=\&quot;\/methods\/about-the-quarterly-income-measure-of-gdp\/\&quot;&gt;About the quarterly income measure of GDP&lt;\/a&gt; provides more information on the GDPI measure.&lt;\/p&gt;\n&lt;p&gt;&lt;a href=\&quot;\/methods\/national-accounts-income-saving-assets-and-liabilities-sources-and-methods\/\&quot;&gt;National accounts (income, saving, assets, and liabilities): Sources and methods (fourth edition)&lt;\/a&gt; provides the data sources and compilation methods used in estimating GDPI as well as income by institutional sector and saving, assets
