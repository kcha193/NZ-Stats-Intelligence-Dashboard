[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nzstats"
version = "0.1.0"
description = "NZ Stats Intelligence Dashboard backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pandas>=2.2",
  "apscheduler>=3.10,<4",
  "tzdata",
]

[project.optional-dependencies]
# Research PDF extraction (Phase 3A). Optional: without it, PDF documents fail with a clear error.
research = ["pypdf>=6.21.4"]
dev = ["pytest>=8", "ruff>=0.6", "pypdf>=6.21.4"]

[project.scripts]
nzstats = "nzstats.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nzstats = ["store/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Long string literals are allowed; `ruff format` enforces line-length 100 on code.
ignore = ["E501"]
