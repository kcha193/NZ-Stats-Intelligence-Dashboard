[institutions.rbnz]
name = "Reserve Bank of New Zealand"
kind = "central_bank"
allowed_hosts = ["www.rbnz.govt.nz", "rbnz.govt.nz"]
landing_urls = ["https://www.rbnz.govt.nz/research-and-publications/publications"]
categories = ["monetary_policy", "financial_stability", "economic_outlook"]
review_status = "needs_review"
content_policy = "full_text"
robots_evidence = "direct_blocked"
landing_evidence = "direct_blocked"
terms_evidence = "direct"
manual_import = "approved"
manual_import_approved_by = "Kevin Chang"
manual_import_approved_on = "2026-10-31"
manual_import_note = "Terms of use read in a browser by the owner on 2026-10-31: material is the Bank's copyright unless otherwise indicated and 'may be reproduced and used without the specific permission of the Bank, provided the Bank is acknowledged and the material is reproduced accurately and is not used in a misleading way'; third-party material is excluded. This covers storing a browser-saved copy with attribution. Automated access is not covered (see access_notes)."
licence = "Copyright of the Bank unless otherwise indicated; may be reproduced without specific permission if the Bank is acknowledged, the material is reproduced accurately and it is not used in a misleading way. Third-party material excluded. Automated access (robots, scrapers) prohibited except public search engines obeying robots.txt, or with the Bank's prior written permission."
licence_url = "https://www.rbnz.govt.nz/about-our-site/terms-of-use"
verified_on = "2026-10-31"
polling = "Monetary Policy Statement quarterly and Financial Stability Report twice yearly; dates are published in advance."
access_notes = "robots.txt and pages returned HTTP 403 to the project probe (2026-10-25). Terms read directly by the owner on 2026-10-31: automated access needs the Bank's prior written permission, which has not been sought or given. review_status moved from restricted to needs_review only so a person may import browser-saved copies; the crawler stays refused. Do not probe without written permission."

[[institutions.rbnz.discovery]]
mechanism = "rss"
url = "https://www.rbnz.govt.nz/feeds/news"
series = "news_release"
verified = false
note = "News releases only, seen in search results; not fetched. No publications or MPS feed was found."

