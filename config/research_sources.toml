[institutions.treasury]
name = "The Treasury (New Zealand)"
kind = "government"
allowed_hosts = ["www.treasury.govt.nz"]
blocked_path_prefixes = ["/publications/search"]
landing_urls = ["https://www.treasury.govt.nz/publications"]
categories = ["fiscal", "economic_outlook", "budget"]
review_status = "needs_review"
content_policy = "full_text"
robots_evidence = "direct"
landing_evidence = "direct_blocked"
terms_evidence = "direct"
manual_import = "approved"
manual_import_approved_by = "Kevin Chang"
manual_import_approved_on = "2026-10-31"
manual_import_note = "Copyright and licensing page read in a browser by the owner on 2026-10-31: Crown copyright material is licensed for re-use under CC BY 4.0 unless indicated otherwise for specific items or collections; credit the Treasury. Material marked 'Copyright Held by Non-Crown Party' and government logos and emblems are excluded. The 15 October 2026 FEU PDF has no item-specific notice, so the site default applies. This covers storing a browser-saved copy with attribution."
licence = "Crown copyright, Creative Commons Attribution 4.0 International unless indicated; third-party material and logos excluded."
licence_url = "https://www.treasury.govt.nz/copyright-and-licensing"
verified_on = "2026-10-31"
polling = "Budget, HYEFU and Monthly Economic Indicators follow the Treasury's published calendar."
access_notes = "robots.txt re-read 2026-10-31 (HTTP 200; only User-agent *; disallows /publications/search, /search/, /admin/, /user/*, /core/ and /profiles/; no Sitemap, no Crawl-delay; /publications/feu/ and /sites/default/files/ are not disallowed). /copyright-and-licensing, the Fortnightly Economic Updates collection and the 15 October 2026 FEU page returned HTTP 403 to an automated read on 2026-10-31, as /publications, /sitemap.xml and /copyright did earlier. The licence was read in a browser by the owner on 2026-10-31. Approved route: manual import of browser-saved copies. The crawler stays refused (needs_review) and no project-client probe is authorised. See docs/superpowers/specs/2026-10-28-phase-3d-design.md."

[[institutions.treasury.discovery]]
mechanism = "html_links"
url = "https://www.treasury.govt.nz/publications"
link_pattern = "^https://www\\.treasury\\.govt\\.nz/(publications|sites/default/files)/.+"
verified = false
note = "Listing structure not yet observed. PDFs live at /sites/default/files/YYYY-MM/<name>.pdf (search results)."

