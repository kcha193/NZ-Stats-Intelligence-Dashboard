# Institutional research source registry (Phase 3A). See docs/data-sources/research.md.
#
# Nothing here is fetched until a human sets review_status = "approved" and fills approved_by, approved_on
# and approval_note after reading the institution's terms. The loader rejects approval without them.
#
#   review_status   approved | needs_review | restricted
#   content_policy  full_text (store text) | metadata_only (title/date/link; body never downloaded) | none
#   *_evidence      direct (fetched and read) | direct_blocked (probe was refused) | search (a search-engine
#                   summary only; not read on the page) | none (not examined)
#   llm_processing  denied (default: never sent to a language model) | local_only (a model on this machine only)
#                   | hosted (a hosted LLM provider too). Sending text to a hosted model is processing by a third
#                   party: set it only after reading that the terms allow it, and record what they say in
#                   llm_processing_note. Requires an approved full_text source. Phase 3B; none is set.
#
# Probed 2026-10-25 with a generic client, not the project User-Agent. A 403 is recorded as
# direct_blocked and does NOT prove the project's descriptive User-Agent would be refused.
# Landing URLs that were not established are left empty rather than guessed.

# ---------------------------------------------------------------------------------------------------------
[institutions.rbnz]
name = "Reserve Bank of New Zealand"
kind = "central_bank"
allowed_hosts = ["www.rbnz.govt.nz", "rbnz.govt.nz"]
landing_urls = ["https://www.rbnz.govt.nz/research-and-publications/publications"]
categories = ["monetary_policy", "financial_stability", "economic_outlook"]
review_status = "restricted"
content_policy = "none"
robots_evidence = "direct_blocked"
landing_evidence = "direct_blocked"
terms_evidence = "search"
licence = "Copyright of the Bank; reuse with attribution and accuracy. Automated scraping reportedly restricted except public search engines obeying robots.txt, or with prior written permission."
licence_url = "https://www.rbnz.govt.nz/about-our-site/terms-of-use"
verified_on = "2026-10-25"
polling = "Monetary Policy Statement quarterly and Financial Stability Report twice yearly; dates are published in advance."
access_notes = "robots.txt and pages returned HTTP 403 to the probe. The terms (read via a search summary only) restrict automated access without written permission: obtain it, then re-probe, before changing review_status."

[[institutions.rbnz.discovery]]
mechanism = "rss"
url = "https://www.rbnz.govt.nz/feeds/news"
series = "news_release"
verified = false
note = "News releases only, seen in search results; not fetched. No publications or MPS feed was found."

