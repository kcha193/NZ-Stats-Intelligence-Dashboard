[stats_nz]
base_url = "https://www.stats.govt.nz"
calendar_ics_path = "/release-calendar/calendar-export/"
release_month_path = "/api/v1/releaseCalendarMonth/{month}"
release_page_path = "/information-releases/{slug}/"

[polling]
# Minutes after the scheduled publication time at which a release is polled.
offsets_minutes = [0, 1, 2, 5, 10, 15, 30, 60, 120, 180]
# On startup, releases published within this many days without a vintage are ingested.
catch_up_days = 7

[migration]
country_window_months = 36
# Oldest reference period to backfill. Set from the vintage-depth spike
# (docs/data-sources/migration-vintage-depth.md): 26 contiguous releases from June 2024.
backfill_since = "2024-06"

[refresh]
# On-open refresh (the default for `scripts/run.sh`): opening the dashboard asks the local server to check once.
# A completed check this recent is reused (override with NZSTATS_REFRESH_WINDOW_MINUTES).
fresh_window_minutes = 30
# A failed check is retried no sooner than this.
failure_cooldown_minutes = 10
# "Check now" still waits this long after the previous check.
manual_min_interval_seconds = 60
# Bounded catch-up per check: releases ingested, and logical GETs including the four calendar requests.
max_releases = 6
max_requests = 40
